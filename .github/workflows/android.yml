name: Android quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, unit tests and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Verify upstream provenance and emoji reproducibility
        run: |
          python3 tools/verify_engine_sources.py
          python3 tools/verify_public_release.py
          python3 tools/build_layout.py
          python3 tools/build_emoji_catalog.py
          git diff --exit-code -- ui-demo/app/src/main/assets/emoji/catalog.json ui-demo/app/src/main/assets/geometry.json
      - name: Compile, lint and test
        working-directory: ui-demo
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :engine:assembleDebugAndroidTest
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            ui-demo/app/build/reports/
            ui-demo/engine/build/reports/
          if-no-files-found: warn

  instrumentation:
    name: Android instrumentation (API 35, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Free runner disk for the emulator userdata partition
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - name: Run native and app integration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          working-directory: ui-demo
          script: ./gradlew --no-daemon -PengineAbis=x86_64 :engine:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Preserve instrumentation results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-reports
          path: |
            ui-demo/app/build/reports/androidTests/
            ui-demo/engine/build/reports/androidTests/
            ui-demo/app/build/outputs/androidTest-results/
            ui-demo/engine/build/outputs/androidTest-results/
          if-no-files-found: warn
