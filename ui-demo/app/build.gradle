plugins { id 'com.android.application' }

// The optional signing configuration must live outside the repository.
def signingPath = providers.gradleProperty('signingPropertiesFile').orNull
def releaseProperties = new Properties()
if (signingPath != null) {
    file(signingPath).withInputStream { releaseProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!releaseProperties.getProperty(name)) {
            throw new GradleException("Missing release signing property: " + name)
        }
    }
}
android {
    namespace 'hu.keyboard.proof'
    compileSdk 36
    ndkVersion '27.2.12479018'
    if (providers.gradleProperty('latinimeNdkPath').isPresent()) { ndkPath providers.gradleProperty('latinimeNdkPath').get() }
    defaultConfig {
        applicationId 'hu.keyboard.proof'
        minSdk 33
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        targetSdk 36
        versionCode 9
        versionName '0.8.1-preview'
    }
    signingConfigs {
        if (signingPath != null) {
            publication {
                storeFile file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingPath != null) signingConfig signingConfigs.publication
        }
        debug {
            // Opt in only to update an existing installation signed with the same debug key.
            if (!providers.gradleProperty('updateOriginal').isPresent()) {
                applicationIdSuffix '.debug'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':engine'); testImplementation 'junit:junit:4.13.2' }

dependencies { androidTestImplementation 'androidx.test:runner:1.6.2'; androidTestImplementation 'androidx.test.ext:junit:1.2.1' }
